<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}.hbook{display:inline-block;margin-left:8px;font-size:12px;color:var(--muted,#7a837e);font-weight:400}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head><body>
<title>실자료 · 감탄 고객관리</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700;800;900&display=swap">
<style>
/* 레이아웃: 예전 CRM(v17) 그대로 — 위 남색 띠, 왼쪽 캘린더/목록, 오른쪽 고객 화면(폰은 전체 화면) */
:root{
  --bg:#eef0f5; --card:#ffffff; --line:#e2e5ee; --line2:#eff1f6; --fg:#1a1a2e; --sub:#4b5263; --muted:#8a90a0;
  --acc:#6366f1; --acc-bg:#eef0ff; --acc-fg:#4338ca;
  --top:#1a1a2e; --top-fg:#ffffff; --top-sub:#a9adc4;
  --memo-bg:#fffbea; --memo-line:#fde68a; --memo-fg:#92400e;
  --ok:#15803d; --ok-bg:#ecfdf3; --ok-line:#bbf7d0;
  --warn:#b45309; --warn-bg:#fff6e5; --warn-line:#fcd9a0;
  --crit:#dc2626; --crit-bg:#fff1f1; --crit-line:#fecaca;
  --tbd:#be185d; --tbd-bg:#fdf2f8; --tbd-line:#f9a8d4;
  --am:#dc2626; --pm:#2563eb;
  --k-fam:#3a9412; --k-id:#2563eb; --k-pro:#7c3aed; --k-con:#dc2626; --k-cend:#9ca3af; --k-cancel:#9ca3af; --k-delay:#ea580c;
  --green-box:#f0fdf4; --green-line:#bbf7d0; --green-fg:#166534;
  --f-body:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121319; --card:#1b1d27; --line:#2c2f3d; --line2:#232633; --fg:#eceef5; --sub:#b7bccb; --muted:#7f8597;
  --acc:#8b8ef7; --acc-bg:#25264a; --acc-fg:#c7c9ff;
  --top:#0b0c13; --top-fg:#f3f4fa; --top-sub:#8d92ab;
  --memo-bg:#2a2415; --memo-line:#5a4919; --memo-fg:#f3cf7c;
  --ok:#4ade80; --ok-bg:#13281c; --ok-line:#1f5133;
  --warn:#fbbf24; --warn-bg:#2a2110; --warn-line:#5b4313;
  --crit:#f87171; --crit-bg:#2d1517; --crit-line:#5e2328;
  --tbd:#f472b6; --tbd-bg:#2c1524; --tbd-line:#6b2650;
  --am:#f87171; --pm:#60a5fa;
  --k-fam:#7fd14c; --k-id:#60a5fa; --k-pro:#a78bfa; --k-con:#f87171; --k-cend:#6b7280; --k-cancel:#6b7280; --k-delay:#fb923c;
  --green-box:#122219; --green-line:#1f4a30; --green-fg:#86efac; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121319; --card:#1b1d27; --line:#2c2f3d; --line2:#232633; --fg:#eceef5; --sub:#b7bccb; --muted:#7f8597;
  --acc:#8b8ef7; --acc-bg:#25264a; --acc-fg:#c7c9ff;
  --top:#0b0c13; --top-fg:#f3f4fa; --top-sub:#8d92ab;
  --memo-bg:#2a2415; --memo-line:#5a4919; --memo-fg:#f3cf7c;
  --ok:#4ade80; --ok-bg:#13281c; --ok-line:#1f5133;
  --warn:#fbbf24; --warn-bg:#2a2110; --warn-line:#5b4313;
  --crit:#f87171; --crit-bg:#2d1517; --crit-line:#5e2328;
  --tbd:#f472b6; --tbd-bg:#2c1524; --tbd-line:#6b2650;
  --am:#f87171; --pm:#60a5fa;
  --k-fam:#7fd14c; --k-id:#60a5fa; --k-pro:#a78bfa; --k-con:#f87171; --k-cend:#6b7280; --k-cancel:#6b7280; --k-delay:#fb923c;
  --green-box:#122219; --green-line:#1f4a30; --green-fg:#86efac; color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--top)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num,.tn{font-variant-numeric:tabular-nums}

/* 위 띠 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--top);color:var(--top-fg)}
.top-in{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-weight:800;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.tabs{display:flex;gap:4px}
.tab{background:transparent;border:1px solid transparent;color:var(--top-sub);border-radius:8px;padding:6px 12px;font-weight:700;font-size:14px;min-height:36px}
.tab[aria-pressed="true"]{background:rgba(255,255,255,.12);color:var(--top-fg);border-color:rgba(255,255,255,.18)}
.top-r{margin-left:auto;display:flex;gap:8px;align-items:center;flex:1 1 260px;justify-content:flex-end;min-width:0;flex-wrap:wrap}
.srch{flex:1 1 120px;max-width:280px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:7px 10px;color:var(--top-fg);min-width:0}
.srch::placeholder{color:var(--top-sub)}
.who{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:6px 8px;color:var(--top-fg)}
.who option{color:#1a1a2e}
.addbtn{background:var(--acc);border:0;color:#fff;border-radius:8px;padding:7px 12px;font-weight:700;white-space:nowrap;min-height:36px}

/* 본문 */
.wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* 고객 화면: 캘린더 위에 새 화면으로 꽉 차게 뜸 (닫으면 보던 캘린더 그대로) */
#right{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;overflow-anchor:none;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 40px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#right:not(.open){display:none}
html.lock,html.lock body{overflow:hidden}
#cp{max-width:1180px;margin:0 auto;display:flex;flex-direction:column}
.cpside{order:3}.cphist{order:4}
@media (min-width:980px){
  #cp{display:grid;grid-template-columns:minmax(0,1fr) 340px;column-gap:16px;align-items:start}
  #cp-bar,#cp-head,#cp-stats{grid-column:1 / -1}
  .cphist{grid-column:1;grid-row:4}
  .cpside{grid-column:2;grid-row:4;position:sticky;top:56px;max-height:calc(100vh - 70px);overflow:auto}
}
#left{min-width:0}
.status{font-size:12px;color:var(--muted);margin-bottom:8px}
.empty{color:var(--muted);text-align:center;padding:28px 12px}

/* 캘린더 (v17) — 캘린더만 예전 글씨체(Noto Sans KR) */
#v-cal{font-family:'Noto Sans KR',system-ui,-apple-system,'Malgun Gothic',sans-serif}
.calbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.calbar{position:relative}
.calbar h2{margin:0;font-size:20px;font-weight:800;min-width:118px;text-align:center}
.mlab{border:0;background:none;font:inherit;color:inherit;padding:2px 6px;border-radius:8px;cursor:pointer}
.mlab:hover,.mlab[aria-expanded=true]{background:var(--acc-bg)}
.mpick{position:absolute;top:44px;left:0;z-index:30;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:10px;width:264px}
.mp-y{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mp-y b{font-size:18px;font-weight:800}
.mp-m{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mp-m button{height:40px;border:1px solid var(--line);background:var(--card);border-radius:8px;font-weight:600;font-size:15px;color:var(--fg)}
.mp-m button:hover{border-color:var(--acc)}
.mp-m button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.mp-m button.now{border-color:var(--acc);color:var(--acc-fg)}
.nav{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:18px;line-height:1}
.ghost{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;font-weight:600;min-height:36px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.fchip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700;color:var(--sub);min-height:30px}
.fchip.fcon{border-color:var(--k-con);color:var(--k-con);background:color-mix(in srgb,var(--k-con) 8%,var(--card))}
.fchip b{margin-left:4px;font-weight:800}
.fchip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.dow{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding:4px 0}
.dow.su{color:var(--am)}.dow.sa{color:var(--pm)}
.day{background:var(--card);border:1px solid var(--line);border-radius:6px;min-height:118px;padding:4px 5px 6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.day.off{opacity:.45}
.day.today{border:2px solid var(--acc)}
.day.sel{box-shadow:0 0 0 2px var(--acc) inset}
.dn{font-weight:900;font-size:15px;line-height:1;margin-bottom:3px;display:flex;align-items:center;gap:4px;background:none;border:0;padding:0;text-align:left;color:inherit}
.dn.su{color:var(--am)}.dn.sa{color:var(--pm)}
.day.today .dn span{background:var(--acc);color:#fff;border-radius:999px;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.dmbox{position:relative}
.dmemo{display:block;width:100%;border:0;border-radius:5px;background:#e8e8e8;font-size:12px;text-align:center;padding:5px 7px;resize:none;min-height:44px;line-height:1.55;color:#111;font-weight:600;overflow:hidden}
.dmemo:focus{background:#ddd;outline:none}
.dmemo::placeholder{color:#bbb;font-size:13px;font-weight:400}
.mcols{display:none;gap:9px;padding:3px 2px 5px;align-items:center}
.dmbox:focus-within .mcols{display:flex}
.mcols span{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px #bbb}
.ev{display:block;width:100%;text-align:left;background:transparent;border:0;border-radius:2px;padding:1px 3px;margin-bottom:1px;font-size:12px;line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}

.ev b{font-weight:400}
.ev:hover{background:var(--line2)}
.ev .t{font-weight:500;margin-right:4px;display:inline-block;min-width:30px}
.am{color:var(--am)}.pm{color:var(--pm)}
.ev .evx{font-weight:400}
.ev .sc{display:inline-block;margin-left:3px;font-size:10.5px;font-weight:700;border-radius:4px;padding:0 4px;vertical-align:1px}
.k-fam{color:var(--k-fam)}.k-id{color:var(--k-id)}.k-pro{color:var(--k-pro)}.k-con{color:var(--k-con)}.k-delay{color:var(--k-delay)}
.k-cend{color:var(--k-cend)}
.k-cancel{color:var(--k-cancel);text-decoration:line-through}
.agenda{display:none}
.agm{padding:10px 14px;border-bottom:1px solid var(--line)}
.agtx{white-space:pre-wrap;font-size:14.5px;line-height:1.6;font-weight:600;background:#f1f1f1;border-radius:8px;padding:9px 12px;margin-bottom:6px}
.agta{display:block;width:100%;box-sizing:border-box;font:inherit;font-size:15px;line-height:1.6;font-weight:600;border:1px solid var(--line);border-radius:8px;padding:9px 12px;resize:vertical;background:#fff}
.agbtn{display:flex;justify-content:flex-end;margin-top:4px}.agbtn .ghost{font-size:13px;padding:5px 12px}
.agcols{display:flex!important;gap:8px;margin-bottom:6px}.agcols span{width:22px;height:22px;border-radius:50%;cursor:pointer}
@media (max-width:700px){
  .day{min-height:74px;padding:3px}
  .dmemo{display:none}.dmemo.has{display:block;font-size:10.5px;padding:1px 3px;min-height:0}
  /* 폰: 칸 안 메모는 한 줄 보기만 — 날짜를 누르면 아래 그날 칸에서 전체 보기·수정 */
  .dmemo.has{height:1.7em!important;white-space:nowrap;overflow:hidden;line-height:1.7em;padding:0 3px;font-size:10px;text-align:left;pointer-events:none}
  .dmbox .mcols{display:none!important}
  .ev{font-size:11px;padding:1px}.ev .evx,.ev .sc{display:none}.ev .t{display:none}
  .agenda{display:block;margin-top:12px}
}

/* 목록 줄 (오늘 할 일·고객 찾기·일정) */
.grp{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.grp h3{margin:0;padding:10px 14px;font-size:14px;font-weight:800;display:flex;justify-content:space-between;border-bottom:1px solid var(--line2)}
.grp h3 span{color:var(--muted);font-weight:600}
.grp.crit h3{color:var(--crit);background:var(--crit-bg)}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line2);padding:10px 14px;min-height:48px}
.row:first-of-type{border-top:0}
.row:hover{background:var(--line2)}
.row .d{flex:0 0 58px;font-size:13px;color:var(--sub);line-height:1.3}
.row .b{flex:1;min-width:0;word-break:keep-all;overflow-wrap:anywhere}
.mhit{display:block;margin-top:3px;font-size:12.5px;color:var(--memo-fg);background:var(--memo-bg);border-radius:6px;padding:2px 7px;width:fit-content;max-width:100%}
.mhit mark{background:none;color:inherit;font-weight:800;text-decoration:underline;text-underline-offset:2px}
.rowa{display:flex;align-items:stretch;border-top:1px solid var(--line2)}.rowa .row{border-top:0}
.ackb{flex:0 0 auto;border:0;border-left:1px solid var(--line2);background:transparent;color:var(--muted);font-weight:700;font-size:12.5px;padding:0 14px;cursor:pointer}
@media (max-width:480px){.rowa .row .sc{display:none}}
.ackb:hover{color:var(--ok);background:var(--ok-bg)}
.row .note{display:block;font-size:12.5px;color:var(--sub);font-weight:600}
/* 오늘 손님 브리핑 (진행판 방식) */
.brow{display:flex;gap:12px;align-items:flex-start;border-top:1px solid var(--line2);padding:12px 14px}
.brow .d{flex:0 0 52px;font-size:14px;padding-top:2px}
.brow .b{flex:1;min-width:0;word-break:keep-all;overflow-wrap:anywhere}
.bnm{font-size:16px;font-weight:700;text-decoration:none;color:var(--fg)}
.bpts{list-style:none;margin:5px 0 0;padding:0}
.bpts li{position:relative;padding:1px 0 1px 14px;font-size:14px;line-height:1.5}
.bpts li::before{content:"";position:absolute;left:3px;top:.66em;width:5px;height:5px;border-radius:50%;background:var(--ok)}
.bbox{margin-top:8px;border:1px solid var(--line);border-radius:9px;background:var(--line2)}
.bbox summary,.braw summary{cursor:pointer;list-style:none;padding:7px 11px;font-size:13.5px;font-weight:700;color:var(--ok)}
.bbox summary::-webkit-details-marker,.braw summary::-webkit-details-marker{display:none}
.bbox summary::before,.braw summary::before{content:"▸ "}
.bbox[open]>summary::before,.braw[open]>summary::before{content:"▾ "}
.bbody{padding:0 12px 10px}
.bbody h4{margin:9px 0 2px;font-size:13.5px;font-weight:700}
.braw{margin-top:8px;border-top:1px dashed var(--line)}
.braw summary{padding-left:0;color:var(--muted)}
.bnone{font-size:13px;color:var(--muted)}
.sc{font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;white-space:nowrap}
.c-crit{color:var(--crit);background:var(--crit-bg)}
.sc.kc{background:color-mix(in srgb,currentColor 11%,transparent);text-decoration:none}.c-warn{color:var(--warn);background:var(--warn-bg)}.c-ok{color:var(--ok);background:var(--ok-bg)}
.c-acc{color:var(--acc-fg);background:var(--acc-bg)}.c-pm{color:var(--pm);background:var(--acc-bg)}.c-mute{color:var(--muted);background:var(--line2)}.c-tbd{color:var(--tbd);background:var(--tbd-bg)}

/* 고객 화면 (v17) */
.cpbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;background:var(--bg);padding:6px 0 8px;margin-top:-6px}
.cpbar b{font-size:16px;font-weight:800;min-width:0;overflow-wrap:anywhere}
.cp-head{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.cp-name{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cp-name h2{margin:0;font-size:22px;font-weight:800}
.cno{font-size:12px;font-weight:700;background:var(--acc-bg);color:var(--acc-fg);border-radius:6px;padding:2px 8px}
.back{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;font-weight:700;min-height:36px}
.phone{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:14px;color:var(--pm);background:var(--acc-bg);border-radius:8px;padding:3px 10px;user-select:all}
.pin{white-space:pre-line;margin-top:8px;background:var(--crit-bg);color:var(--crit);border-radius:8px;padding:7px 10px;font-weight:700;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center}
.stat small{display:block;font-size:11.5px;font-weight:700;color:var(--muted)}
.stat b{font-size:16px;font-weight:800}
@media (max-width:480px){.stats{gap:4px}.stat{padding:7px 2px;border-radius:8px}.stat small{font-size:10.5px}.stat b{font-size:13.5px;letter-spacing:-.3px}}
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.nadd{display:flex;gap:6px;margin-bottom:8px}.nadd .inp{flex:1;min-width:0;padding:7px 10px;font-size:13.5px}
.nrow{padding:7px 0;border-top:1px solid var(--line)}.nrow:first-child{border-top:0}
.nmeta{font-size:11.5px;color:var(--muted)}.nmeta b{font-weight:600;color:#6a6af0}
.ntext{white-space:pre-wrap;font-size:13.5px;line-height:1.55;margin-top:2px}
.nnone{font-size:12.5px;color:var(--muted)}.ncnt{font-size:11.5px;font-weight:500;color:var(--muted)}.nmore{margin-top:6px;width:100%}
.sec-t{font-size:13px;font-weight:800;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec-t span{font-weight:500;color:var(--muted);font-size:12px}
.pinta{display:block;width:100%;margin-bottom:6px;resize:none;overflow:hidden;line-height:1.5;min-height:36px;color:var(--crit);font-weight:700}
.pinta::placeholder{color:var(--muted);font-weight:400}
.cmemo{width:100%;min-height:70px;overflow:hidden;border:1px solid var(--memo-line);background:var(--memo-bg);color:var(--fg);border-radius:8px;padding:8px 10px;resize:vertical}

<script>
/* ===== 기본 ===== */
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const p2=n=>String(n).padStart(2,"0");
const _n=new Date();const TODAY=`${_n.getFullYear()}-${p2(_n.getMonth()+1)}-${p2(_n.getDate())}`;
const addDays=(d,n)=>{const x=new Date(d+"T00:00");x.setDate(x.getDate()+n);return `${x.getFullYear()}-${p2(x.getMonth()+1)}-${p2(x.getDate())}`};
const md=d=>d?`${+d.slice(5,7)}/${+d.slice(8,10)}`:"미정";
const dow=d=>"일월화수목금토"[new Date(d+"T00:00").getDay()];
const tm=s=>{if(!s)return"";const h=+s.slice(0,2);return `${h>12?h-12:h}:${s.slice(3,5)||"00"}`};
const ampm=s=>s&&(+s.slice(0,2))<12?"am":"pm";
const money=n=>(+n||0).toLocaleString("ko-KR");
const digits=v=>+(String(v||"").replace(/[^\d]/g,""))||0;
const stamp=v=>!v?"":(/^\d{4}-\d\d-\d\d/.test(v)?md(v):(v==="기존"?"":v));
const uid=p=>(self.crypto&&crypto.randomUUID)?crypto.randomUUID():p+Date.now().toString(36)+Math.random().toString(36).slice(2,5); /* 서버 id = uuid */
const clone=o=>JSON.parse(JSON.stringify(o));
function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)}

let db=null,B={},CUST={},LOGS=[],MEMO={},MEMOC={},loaded=false;
const MCOL={k:"#111",b:"#2563eb",r:"#dc2626",p:"#7c3aed"},MCOLN={k:"검정",b:"파랑",r:"빨강",p:"보라"};
let AGEDIT=null;let view="cal",calY=_n.getFullYear(),calM=_n.getMonth(),selDay=TODAY,calFilter=null;
let LOGSHOW=false;const canLog=()=>["팀장","실장님"].includes(who());
let LOGALL=false,LOGF="all",LOGB="";
const logCat=t=>/\d[\d,]*원|예약금|선금|중도금|잔금|총액|결제|환불|증빙|금액|입금/.test(t||"")?"money":/출고|준비|액자|보정본|원본|리뷰포켓|수령/.test(t||"")?"ship":"step";const CLOGS={};
async function loadCustLogs(key,ids){try{const out=[];for(let i=0;i<ids.length;i+=30){const q=await db.collection("logs").where("booking","in",ids.slice(i,i+30)).get();q.docs.forEach(d=>out.push(d.data()))}CLOGS[key]=out;refresh()}catch(e){}}let openKey=null;const EXP=new Set(),SEEN=new Set();let FORM=null; // FORM={id,type:'pick'|'item'|'pay'}
try{const w=localStorage.getItem("gt-who");if(w)$("who").value=w}catch(e){}
$("who").onchange=()=>{try{localStorage.setItem("gt-who",$("who").value)}catch(e){};$("who").blur();if(typeof refresh==="function"){const cb=$("cp-bar");if(cb)cb._h=null;refresh()}};
const who=()=>$("who").value;

/* ===== 상품·가격 (예전 감탄 콘솔 7월 + 이후 알려준 가격) ===== */
const PRODUCTS={
  story:{name:"감탄스토리",c:"#4f46e5",base:250000,adultAdd:100000,kidAdd:50000,petAdd:50000,frame:"8x10",orig:true},
  simpfam:{name:"감탄 심플패밀리",c:"#059669",base:100000,adultAdd:50000,kidAdd:30000,petAdd:30000,frame:"5x7",orig:true},
  bigfam:{name:"감탄 대가족",c:"#d97706",base:150000,flat:1,petAdd:50000,up11:200000,frame:"8x10",orig:false},
  bigfam_orig:{name:"대가족 원본형",c:"#c2410c",base:650000,flat:1,petAdd:50000,up11:150000,frame:"8x10",orig:true},
  growth:{name:"가족성장 프로젝트",c:"#db2777",base:150000,kidStep:20000,growth:1,frame:"8x10",orig:true},
  kids:{name:"베이비&키즈 프로필",c:"#7c3aed",base:150000,frame:"5x7",orig:true},
  profile:{name:"프로필",c:"#0891b2",base:100000,frame:null,orig:false},
  perform:{name:"연주 프로필",c:"#0e7490",base:170000,extraRetouch:30000,frame:null,orig:false},
  audition:{name:"오디션 프로필",c:"#0e7490",base:170000,extraRetouch:30000,frame:null,orig:false},
  friend:{name:"우정 촬영",c:"#0d9488",base:100000,perHead:50000,frame:"5x7",orig:true},
  jangsu:{name:"부모님 장수 프로필",c:"#78716c",base:200000,frame:"11x14",orig:true,nopick:1},
  halfid:{name:"반명함",c:"#64748b",base:50000,frame:null,orig:false,idlike:1},
  id:{name:"증명사진",c:"#64748b",base:30000,perPerson:1,frame:null,orig:false,idlike:1},
  etc:{name:"기타",c:"#475569",base:0,frame:null,orig:false}
};
const ID_TYPES=[{k:"passport",label:"여권",p:30000},{k:"jumin",label:"주민증",p:30000},{k:"half",label:"반명함",p:30000},{k:"visa",label:"비자",p:35000},{k:"job",label:"취업·프로필",p:50000},{k:"addPass",label:"여권 추가",p:10000,add:1},{k:"addJumin",label:"주민증 추가",p:10000,add:1},{k:"web",label:"웹파일",p:5000,add:1}];
const idqSum=b=>ID_TYPES.filter(t=>!t.add&&(b.idq||{})[t.k]).map(t=>t.label+(+b.idq[t.k]>1?b.idq[t.k]:"")).join(", ");
const PRICE_META=[{k:"f5x7",label:"5×7 액자",p:30000},{k:"f8x10",label:"8×10 액자",p:50000},{k:"f11al",label:"11알 액자",p:500000,big:1},{k:"f16al",label:"16알 액자",p:700000,big:1},
  {k:"f20al",label:"20알 액자",p:800000,big:1},{k:"f20slim",label:"20알 슬림",p:800000,big:1},{k:"canvas",label:"100×70 캔버스",p:1200000,big:1},{k:"album",label:"8×11 앨범",p:3000000},{k:"origadd",label:"원본 추가",p:0}];
function guessKey(b){const t=[b.product,b.cal].join(" ");
  if(b.growth||/가성|가족성장/.test(t))return"growth";if(/원본형/.test(t))return"bigfam_orig";if(/대가족/.test(t))return"bigfam";
  if(/스토리/.test(t))return"story";if(/장수|복원/.test(t))return"jangsu";if(/우정/.test(t))return"friend";
  if(/연주/.test(t))return"perform";if(/오디션/.test(t))return"audition";if(/키즈|베이비|돌|백일/.test(t))return"kids";if(/프로필/.test(t))return"profile";
  if(/반명함/.test(t))return"halfid";if(/증명|여권|주민|비자/.test(t)&&!/가족/.test(t))return"id";return""}
const pk=b=>b.pkey||guessKey(b);
const P=b=>PRODUCTS[pk(b)]||null;
function calcRows(b){
  const p=PRODUCTS[b.pkey];if(!p)return null;const rows=[];let shoot=0;const ad=+b.adults||2,kd=+b.kids||0;
  if(p.growth){const k=Math.max(1,kd);shoot=p.base+(k-1)*p.kidStep;rows.push([`가족성장 ${2+k}인 (자녀 ${k}명) · 1년분`,shoot])}
  else if(p.flat){shoot=p.base;rows.push([p.name+(b.pkey==="bigfam_orig"?" (7인 기준)":" (15인 이하)"),p.base]);if(b.pet){shoot+=p.petAdd;rows.push(["반려동물 추가",p.petAdd])}
    if(b.up11){shoot+=p.up11;rows.push([b.pkey==="bigfam"?"8x10 → 11x14(11알) 변경 (총 35만)":"원본형 11x14(11알) 변경 (총 80만)",p.up11])}}
  else if(p.perHead){const n=Math.max(1,+b.adults||1);shoot=p.base+n*p.perHead;rows.push(["촬영비",p.base],[`${n}인 × ${money(p.perHead)} (개인별 5x7 액자 · 전체 원본)`,n*p.perHead])}
  else if(p.extraRetouch!==undefined){shoot=p.base;rows.push([p.name+" (보정 1장)",p.base]);const r=+b.retouch||0;if(r){shoot+=r*p.extraRetouch;rows.push([`추가 보정 ${r}장`,r*p.extraRetouch])}}
  else if(p.perPerson&&ID_TYPES.some(t=>(b.idq||{})[t.k])){ID_TYPES.forEach(t=>{const q=+(b.idq||{})[t.k]||0;if(q){shoot+=q*t.p;rows.push([t.add?(q>1?`${t.label} ${q}`:t.label):`${t.label} ${q}인`,q*t.p])}})}
  else if(p.perPerson){const n=Math.max(1,ad);shoot=p.base*n;rows.push([`${p.name} ${n}인`,shoot])}
  else if(p.weekendAdd!==undefined){shoot=p.base;rows.push([p.name,p.base]);if(b.weekend){shoot+=p.weekendAdd;rows.push(["주말·공휴일 추가",p.weekendAdd])}}
  else if(p.adultAdd!==undefined){shoot=p.base;rows.push([`${p.name} 기본 (2인)`,p.base]);
    if(ad>2){shoot+=(ad-2)*p.adultAdd;rows.push([`성인 ${ad-2}인 추가`,(ad-2)*p.adultAdd])}
    if(kd>0){shoot+=kd*p.kidAdd;rows.push([`미성년 자녀 ${kd}인 추가`,kd*p.kidAdd])}
    if(b.pet){shoot+=p.petAdd;rows.push(["반려동물 추가",p.petAdd])}}
  else{shoot=p.base;if(p.base)rows.push([p.name,p.base])}
  if(b.pkey==="story"&&shoot>800000){rows.push(["80만원 상한 적용 (촬영+원본)",800000-shoot]);shoot=800000}
  PRICE_META.forEach(m=>{const q=(b.ex||{})[m.k]||0;if(!q||!m.p)return;let a=m.p*q;if(m.big)a=Math.round(a/2);rows.push([`${m.label} ${q}개${m.big?" (50% 할인)":""}`,a])});
  return rows.map(([label,amt])=>({label,amt}));
}
function priceRows(b){
  if(Array.isArray(b.priceItems))return b.priceItems;
  const c=calcRows(b);
  if(c&&b.priceOverride){return [{label:c[0].label,amt:+b.priceOverride}]}
  if(c)return c;
  const old=+b.priceOverride||+b.price||0;
  return old?[{label:(b.product||"촬영").replace(/#\d+/g,"").trim()||"촬영",amt:old}]:[];
}
const totalOf=b=>priceRows(b).reduce((a,r)=>a+(+r.amt||0),0);
const normM=v=>v==="미정"?"":(v||"");
const pays=b=>(b.payments||[]).map((p,i)=>({id:p.id||("p"+i),kind:p.kind||"잔금",amount:+p.amount||0,method:normM(p.method),receipt:normM(p.receipt),date:p.date||""}));
const paidOf=b=>pays(b).reduce((a,p)=>a+p.amount*(p.kind==="환불"?-1:1),0);
const hasDep=b=>pays(b).some(p=>p.kind==="예약금"&&p.amount>0)||!!(b.steps||{}).deposit;
const needPay=b=>pays(b).some(p=>p.amount&&(!p.method||(needReceipt(p.method)&&!p.receipt)));

/* ===== 출고 항목: 저장된 것 + 상품에 따라 나가야 할 것(아직 안 만든 것은 회색 줄) ===== */
function shipRows(b){
  const items=(b.items||[]).map(i=>({...i})),p=P(b),k=pk(b);
  const has=kind=>items.some(i=>i.kind===kind);
  const v=[];
  if(p&&!p.idlike){
    if(p.frame&&!has("액자"))v.push({id:"v-frame",kind:"액자",size:p.frame,virtual:1});
    if(p.frame&&!has("보정본"))v.push({id:"v-ret",kind:"보정본",size:"",virtual:1});
    if(!p.frame&&!has("보정 파일"))v.push({id:"v-file",kind:"보정 파일",size:"",virtual:1});
  }
  if(hasOrig(b)&&!has("원본"))v.push({id:"v-orig",kind:"원본",size:"",virtual:1});
  if(b.review&&!has("리뷰포켓"))v.push({id:"v-pocket",kind:"리뷰포켓",size:"",virtual:1});
  PRICE_META.forEach(m=>{const q=(b.ex||{})[m.k]||0;const kind=m.k==="origadd"?"원본 추가":m.label;if(q&&!items.some(i=>i.exk===m.k||i.kind===kind))v.push({id:"v-ex-"+m.k,kind,size:q>1?`×${q}`:"",exk:m.k,virtual:1})});
  return [...items,...v];
}
function hasOrig(b){if(b.needOrig||(b.items||[]).some(i=>i.kind==="원본"))return true;const p=P(b);return !!(p&&p.orig)}

/* ===== 상태: 기록에서 자동 (설계안 상태 흐름표, 위에서부터 처음 맞는 것) ===== */
function isPast(b){return b.date&&b.date<addDays(TODAY,-90)}
function gsBase(b){const d=pays(b).find(p=>p.kind==="예약금"&&p.date);if(d)return d.date;const pv=b.prevId&&B[b.prevId];return pv&&pv.date||(b.steps||{}).deposit||""}
function status(b){
  const s=b.steps||{},p=P(b);
  if(s.canceled)return{k:"취소",c:"c-mute"};
  if(s.postponed)return{k:"연기",c:"c-warn"};
  if(isPast(b))return{k:"완료",c:"c-ok",past:1};
  if(b.kind==="consult"&&!s.shot)return consOpen(b)?{k:"상담",c:"c-con"}:{k:"상담 끝",c:"c-mute"};
  if(b.kind==="visit")return (b.date||"")<TODAY?{k:"완료",c:"c-ok"}:{k:"방문 예정",c:"c-acc"};
  if(!b.date&&!s.shot){if(b.growth||pk(b)==="growth"){const g=gsBase(b);return g&&g<=addDays(TODAY,-365*3)?{k:"중단",c:"c-mute"}:{k:"미등록",c:"c-tbd"}}return{k:"날짜 미정",c:"c-tbd"}}

  }

  if(s.notified)return{k:"수령 대기",c:"c-acc"};

  if(s.done||(nonOrig.length&&nonOrig.every(r=>r.ready||r.shipped)))return{k:"출고 연락 전",c:"c-warn"};
  if(s.workshop)return{k:"공방",c:"c-warn"};

  if(hasOrig(b)&&!origSent(b))return{k:"원본 발송 전",c:"c-crit",crit:"원본 발송 전"};

}
const isDone=b=>["완료","취소"].includes(status(b).k);
function stepsFor(b){
  if(b.kind==="consult"&&!(b.steps||{}).shot)return[["closed","상담 끝"]];

}
function stepOn(b,k){const s=b.steps||{},rows=shipRows(b);

  if(k==="orig"){const o=(b.items||[]).find(i=>i.kind==="원본"&&i.shipped);return stamp(s.orig||(o&&o.shipped))}return stamp(s[k])}

  if(st==="미입금")return["deposit","예약금"];
  if(!s.shot)return["shot","촬영함"];
  if(st==="원본 발송 전")return["orig","원본"];
  if(st==="사진 선택 대기")return["picked","선택"];
  if(s.picked&&!s.handoff&&st==="작업중")return["handoff","작업"];
  if(st==="작업중"||st==="공방")return["done","완료"];
  if(st==="출고 연락 전")return["notified","연락"];
  if(status(b).rest){const left=shipRows(b).filter(r=>!r.shipped);return["rest",left.length===1?left[0].kind:"출고"]}
  if(st==="수령 대기")return["delivered",b.ship==="택배"?"택배 발송":"수령"];
  return null;
}

function frameLines(b){const fr=shipRows(b).filter(r=>r.kind==="액자"||/액자|캔버스|슬림/.test(r.kind)&&r.exk);
  const toInch=z=>({"8x10":"8x10인치","5x7":"5x7인치","11x14":"11x14인치","16x20":"16x20인치","20x24":"20x24인치","4x6":"4x6인치","11알 액자":"11x14인치","16알 액자":"16x20인치","20알 액자":"20x24인치","20알 슬림":"20R 슬림","100×70 캔버스":"캔버스","5×7 액자":"5x7인치","8×10 액자":"8x10인치"})[z]||z;
  if(!fr.length)return "- 8x10인치 액자 1개에 들어갈 사진 1장";
  return fr.map(r=>{const q=r.exk?((b.ex||{})[r.exk]||1):1;return `- ${toInch(r.kind==="액자"?(r.size||"8x10"):r.kind)} 액자 ${q}개에 들어갈 사진 ${q}장`.replace("캔버스 액자","캔버스").replace("20R 슬림 액자","20R 슬림")}).join("\n")}

function bookingRow(b){
  const snap=SNAP[b._bid]||{};const po={};
  ["priceItems","ex","idq","up11","retouch","needOrig"].forEach(k=>{if(b[k]!=null&&b[k]!==false)po[k]=b[k]});
  po.priceOverride=b.priceOverride??null;
  const ui={};for(const k of Object.keys(b))if(!BOOKED.has(k)&&k[0]!=="_"&&b[k]!==undefined)ui[k]=b[k];
  if(b.id!==b._bid)ui._bkey=b.id;
  const g=(b.gs||"").match(/(\d+)\s*-\s*(\d+)/);
  const pv=b.prevId?((B[b.prevId]||{})._bid||(isU(b.prevId)?b.prevId:null)):(snap.prev_id||null);
  const row={customer_no:b.customer_no,product:b.pkey||(b.growth?"growth":null)||snap.product||"etc",
    booked_product:snap.booked_product??((PRODUCTS[b.booked_pkey||b.pkey]||{}).name||null),
    contract_date:snap.contract_date||TODAY,adults:b.adults===""||b.adults==null?null:(+b.adults||0),kids:b.kids===""||b.kids==null?null:(+b.kids||0),pets:b.pet?1:0,
    gs_round:g?+g[1]:null,gs_year:g?+g[2]:null,base_price:totalOf(b)||0,price_override:po,
    calendar_memo:b.cal||null,shoot_memo:b.memo||null,ship_method:b.ship||null,track_no:b.track||null,
    review:!!b.review,sns:!!b.sns,ack:b.ack||{},ui,prev_id:isU(pv)?pv:null};
  // 처음 저장 때 의미 없는 값 바뀜 줄이기 (빈 값 = 그대로)
  if(snap.pets==null&&!row.pets)row.pets=snap.pets??null;
  if(snap.sns==null&&!row.sns)row.sns=snap.sns??null;
  if(!snap.price_override||!Object.keys(snap.price_override).length){if(Object.keys(po).length===1&&po.priceOverride===(snap.base_price||0))row.price_override=snap.price_override??{}}
  if(row.base_price===0&&snap.base_price)row.base_price=snap.base_price;
  for(const [k,c] of Object.entries(STEPCOL)){const v=(b.steps||{})[k];row[c]=D8(v)||(v?snap[c]||null:null)}
  return row;
}
const diff=(row,snap)=>{const out={};for(const k in row){if(JSON.stringify(row[k]??null)!==JSON.stringify(snap[k]??null))out[k]=row[k]}return out};
async function writeItems(b){
  const old=SNAPI[b._bid]||{},keep=new Set();
  for(const it of (b.items||[])){
    if(it.virtual)continue;if(!isU(it.id))it.id=newId();keep.add(it.id);
    const o=old[it.id]||{};
    const kind=(o.kind&&ITEMK(o.kind,o.sm_item)===it.kind)?o.kind:(it.kind||"기타"); // SM 원래 이름 유지
    const row={id:it.id,booking_id:b._bid,kind,size:it.size||null,frame:it.frame||null,photo_no:it.photo||null,request:it.request||null,
      ready_at:D8(it.ready)||(it.ready?o.ready_at||null:null),shipped_at:D8(it.shipped)||(it.shipped?o.shipped_at||null:null),memo:it.memo||null,sm_item:it.sm||o.sm_item||null,
      workshop_at:D8(it.workshop)||(it.workshop?o.workshop_at||null:null)};
    const d=old[it.id]?diff(row,o):row;
    if(Object.keys(d).length){mine(b._bid);const {error}=await sb.from("items").upsert(row);if(error)throw error;SNAPI[b._bid]={...SNAPI[b._bid],[it.id]:{...o,...row}}}
  }
  const gone=Object.keys(old).filter(id=>!keep.has(id)&&!/^증명사진$/.test(old[id].kind||""));
  if(gone.length){mine(b._bid);const {error}=await sb.from("items").delete().in("id",gone);if(error)throw error;gone.forEach(id=>delete SNAPI[b._bid][id])}
}
async function writePays(b){
  const old=SNAPP[b._bid]||{},keep=new Set();
  for(const p of (b.payments||[])){
    if(!isU(p.id))p.id=newId();keep.add(p.id);const o=old[p.id]||{};
    const row={id:p.id,booking_id:b._bid,customer_no:b.customer_no,paid_at:D8(p.date)||TODAY,amount:+p.amount||0,kind:p.kind||"잔금",method:p.method||null,receipt:p.receipt||null,legacy:o.legacy||false};
    const d=old[p.id]?diff(row,o):row;
    if(Object.keys(d).length){mine(b._bid);const {error}=await sb.from("payments").upsert(row);if(error)throw error;SNAPP[b._bid]={...SNAPP[b._bid],[p.id]:{...o,...row}}}
  }
  const gone=Object.keys(old).filter(id=>!keep.has(id));
  if(gone.length){mine(b._bid);const {error}=await sb.from("payments").delete().in("id",gone);if(error)throw error;gone.forEach(id=>delete SNAPP[b._bid][id])}
}
async function writeShootSlot(b){ // 촬영 날짜·시간 = 촬영 일정 1줄
  const st=b.time?b.time.slice(0,5)+":00":null;
  if(b.date){
    if(b._sid){const o=SNAPS[b._sid]||{};const d=diff({date:b.date,start_time:st,customer_no:b.customer_no},{date:o.date,start_time:o.start_time,customer_no:o.customer_no});
      if(Object.keys(d).length){mine(b._bid);mine(b._sid);const {error}=await sb.from("schedules").update(d).eq("id",b._sid);if(error)throw error;SNAPS[b._sid]={...o,...d}}}
    else{const id=newId();const row={id,customer_no:b.customer_no,booking_id:b._bid,kind:"shoot",date:b.date,start_time:st,title:(PRODUCTS[b.pkey]||{}).name||b.product||null,memo:b.cal||null};
      mine(b._bid);mine(id);const {error}=await sb.from("schedules").insert(row);if(error)throw error;b._sid=id;SNAPS[id]=row}
  }else if(b._sid){ // 날짜를 비우면 그 일정은 '연기'로 기록에 남김
    mine(b._bid);mine(b._sid);const {error}=await sb.from("schedules").update({state:"연기"}).eq("id",b._sid);if(error)throw error;SNAPS[b._sid]={...SNAPS[b._sid],state:"연기"};b._sid=null}
}
async function writeBooking(key){
  const b=B[key];if(!b)return;
  if(!b._bid&&b._sid&&(b._hist||!(b.kind==="shoot"||b.pkey||(b.payments||[]).length||(b.items||[]).length)))return writeSched(key);
  if(!b.customer_no)b.customer_no=await rpcNo();
  await ensureCustomerRow(b.customer_no,b.name);
  const row=bookingRow(b);
  if(!b._bid){ // 새 계약 (또는 상담 → 촬영으로 바뀜)
    const bid=newId();mine(bid);
    const {data,error}=await sb.from("bookings").insert({id:bid,...row,ui:{...row.ui,_bkey:key}}).select().single();if(error)throw error;
    SNAP[bid]=data;b._bid=bid;BID2KEY[bid]=key;SNAPI[bid]={};SNAPP[bid]={};
    if(b._sid&&SNAPS[b._sid]){mine(b._sid);const {error:e2}=await sb.from("schedules").update({booking_id:bid,kind:"shoot",state:null}).eq("id",b._sid);if(e2)throw e2;SNAPS[b._sid]={...SNAPS[b._sid],booking_id:bid,kind:"shoot",state:null}}
  }else{
    const d=diff(row,SNAP[b._bid]||{});
    if(Object.keys(d).length){mine(b._bid);const {data,error}=await sb.from("bookings").update(d).eq("id",b._bid).select().single();if(error)throw error;SNAP[b._bid]=data}
  }
  await writeShootSlot(b);await writeItems(b);await writePays(b);
}
async function writeSched(key){ // 상담·모니터·방문처럼 일정만 있는 것
  const b=B[key];const s=SNAPS[b._sid]||{};
  if(b.customer_no)await ensureCustomerRow(b.customer_no,b.name);
  const st=b.steps||{};
  const state=st.canceled?"취소":st.postponed?"연기":(b.kind==="consult"&&st.closed)?"완료":(s.state&&["취소","연기"].includes(s.state)?null:s.state||null);
  const ui={...(s.ui||{})};for(const k of Object.keys(b))if(!["id","_bid","_sid","kind","customer_no","date","time"].includes(k)&&k[0]!=="_"&&b[k]!==undefined)ui[k]=b[k];
  if(b.id!=="s"+b._sid)ui._bkey=b.id;
  const row={customer_no:b.customer_no||null,date:b.date||s.date||TODAY,start_time:b.time?b.time.slice(0,5)+":00":(s.start_time||null),state,ui,kind:s.kind||(b.kind==="consult"?"consult":"visit")};
  mine(b._sid);
  if(!SNAPS[b._sid]){Object.assign(row,{id:b._sid,title:b.product||b.name||null,memo:b.cal||null});const {error}=await sb.from("schedules").insert(row);if(error)throw error;SNAPS[b._sid]=row;return}
  const d=diff(row,s);if(Object.keys(d).length){const {error}=await sb.from("schedules").update(d).eq("id",b._sid);if(error)throw error;SNAPS[b._sid]={...s,...d}}
}
const CCOL={name:"name",phone:"phone",phone2:"phone2",family:"family",memo:"memo",warn:"warn",bday:"bday",anniv:"anniv",visit:"source",email:"email"};
async function writeCustomer(key,c){
  if(key[0]!=="n"){const {error}=await sb.from("temp_customers").upsert({key,data:c,updated_at:new Date().toISOString()});if(error)throw error;return}
  const no=+key.slice(1);await ensureCustomerRow(no,c.name);

const SAVEQ=[];let qRun=false; // 저장은 한 줄로 차례차례 (순서 꼬임 방지)
function enqueue(fn){return new Promise((res,rej)=>{SAVEQ.push([fn,res,rej]);if(!qRun)pump()})}
async function pump(){qRun=true;while(SAVEQ.length){const [fn,res,rej]=SAVEQ.shift();try{res(await fn())}catch(e){console.warn("저장 실패",e);rej(e)}}qRun=false}
function docRef(path){
  const i=path.indexOf("/"),col=path.slice(0,i),key=path.slice(i+1);
  return {
    set(data){return enqueue(async()=>{
      if(col==="bookings"){B[key]={...(B[key]||{}),...clone(data),id:key};const b=B[key];
        if(data.kind==="consult"){b._sid=b._sid||newId();return writeSched(key)}return writeBooking(key)}
      if(col==="customers")return writeCustomer(key,data);
      if(col==="memos"){mine("m"+key);const {error}=await sb.from("day_memos").upsert({date:key,text:data.text||null,color:data.color||null,updated_at:new Date().toISOString()});if(error)throw error}
    })},
    update(){return enqueue(async()=>{if(col==="bookings")return writeBooking(key)})},
    delete(){return enqueue(async()=>{if(col==="customers"&&key[0]!=="n")await sb.from("temp_customers").delete().eq("key",key)})}
  };
}

let rtT=0;const rtB=new Set(),rtC=new Set();
const typing=()=>{const a=document.activeElement;return a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)};
function rtFlush(){clearTimeout(rtT);rtT=setTimeout(async()=>{
  if(typing()||SAVEQ.length||qRun){rtFlush();return}  // 입력 중·저장 중이면 잠깐 기다렸다가
  const bs=[...rtB].filter(id=>!isMine(id)),cs=[...rtC].filter(n=>!isMine("c"+n));rtB.clear();rtC.clear();

  if(bs.length||cs.length){["cp-bar","cp-head","cp-stats"].forEach(i=>{const e=$(i);if(e)e._h=null});refresh()}},600)}
function startRealtime(){
  const ch=sb.channel("crm");
  ["bookings","items","payments"].forEach(t=>ch.on("postgres_changes",{event:"*",schema:"public",table:t},p=>{const r=p.new&&Object.keys(p.new).length?p.new:p.old;const id=t==="bookings"?r.id:r.booking_id;if(id&&(SNAP[id]||t==="bookings")){rtB.add(id);rtFlush()}}));
  ch.on("postgres_changes",{event:"*",schema:"public",table:"schedules"},p=>{const s=p.new||{};if(isMine(s.id)||isMine(s.booking_id))return;
    if(s.booking_id){rtB.add(s.booking_id);rtFlush()}else if(s.id){const x=sToB(s,CUSTROW[s.customer_no]);B[x.id]=x;refresh()}});
  ch.on("postgres_changes",{event:"*",schema:"public",table:"customers"},p=>{const c=p.new||{};if(c.customer_no&&CUSTROW[c.customer_no]){rtC.add(c.customer_no);rtFlush()}});
  ch.on("postgres_changes",{event:"*",schema:"public",table:"day_memos"},p=>{const d=p.new||{};if(d.date&&!isMine("m"+d.date)){MEMO[d.date]=d.text||"";if(d.color)MEMOC[d.date]=d.color;refresh()}});
  ch.on("postgres_changes",{event:"INSERT",schema:"public",table:"logs"},p=>{const l=p.new||{};if(l.action==="note"&&l.user_id!==sessUid){LOGS.unshift({booking:l.row_id,text:l.note,who:l.who,at:kst(l.at)});refresh()}});
  ch.on("postgres_changes",{event:"INSERT",schema:"public",table:"notes"},p=>{const r=p.new||{};if(!r.customer_no||isMine("note"+r.id)||r.user_id===sessUid)return;if(NOTE_LOADED.has(r.customer_no)){const a=NOTES["n"+r.customer_no];if(!a.some(x=>x.id===r.id)){a.push(noteRow(r));refresh()}}});
  ch.subscribe();
}
